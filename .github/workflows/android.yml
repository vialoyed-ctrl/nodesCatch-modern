name: Android APK and native speed-test regression
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Download pinned native library
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 https://github.com/oviron/libmihomo-android/releases/download/v0.3.12/libmihomo-android-v0.3.12.aar -o app/libs/libmihomo-android-v0.3.12.aar
          echo 'c5f857d00319a7690b1dbf083387f5617454ed5a21eb87488644de2c18b7e42f  app/libs/libmihomo-android-v0.3.12.aar' | sha256sum -c -
      - name: Build APK and unit tests
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nodescatch.jks
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"; fi
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual core on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.vialoyed.nodescatch.test/androidx.test.runner.AndroidJUnitRunner | tee android/instrumentation.txt
            grep -q 'OK (' android/instrumentation.txt
            adb shell am start -n com.vialoyed.nodescatch/.MainActivity
            sleep 3
            adb exec-out screencap -p > android/screenshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodesCatch-android-v0.1.0
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/test-results/testDebugUnitTest/
            android/instrumentation.txt
            android/screenshot.png
